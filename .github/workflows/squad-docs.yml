name: Squad Docs — Build & Deploy

on:
  workflow_dispatch:
  push:
    branches: [preview]
    paths:
      - '**/*.md'
      - 'rust/**/*.rs'
      - '.github/workflows/squad-docs.yml'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate documentation inputs
        run: |
          test -f README.md
          test -f TEST_DOCS_INDEX.md
          cd rust
          cargo doc --workspace --no-deps --quiet
