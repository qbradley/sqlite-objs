name: Squad Release Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libcurl4-openssl-dev libssl-dev libc6-dev lsof tcl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Azurite
        run: npm install -g azurite

      - name: Provision SQLite TCL source
        run: |
          git clone --depth=1 --branch version-3.52.0 https://github.com/sqlite/sqlite.git test/sqlite-src

      - name: Run full release gate
        env:
          AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          AZURE_STORAGE_SAS: ${{ secrets.AZURE_STORAGE_SAS }}
        run: |
          ./scripts/release-gate.sh --full
          if grep -q "Skipped: 0" build/release-gate-report.txt; then
            echo "Full release gate passed with no skips"
          else
            echo "::error::Full release gate had skipped checks; not release-ready"
            exit 1
          fi
