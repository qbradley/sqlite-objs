name: Squad CI

on:
  pull_request:
    branches: [dev, preview, main, insider]
    types: [opened, synchronize, reopened]
  push:
    branches: [dev, insider]

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Install C toolchain & dependencies ──
      - name: Install C dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            libssl-dev \
            libc6-dev \
            lsof \
            tcl-dev

      # ── Install Rust toolchain ──
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # ── Install Node.js & Azurite ──
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Azurite
        run: npm install -g azurite

      # ── Run fast release gate (local mode) ──
      - name: Run release gate
        run: ./scripts/release-gate.sh

      # ── Upload gate report on failure ──
      - name: Upload release gate report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-report
          path: build/release-gate-report.txt
          if-no-files-found: ignore
